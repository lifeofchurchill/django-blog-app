<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} My Blog {% endblock %}</title>
</head>
<body>
    <h1>My Blog Website</h1>

    {% if form.errors %}
        <div style="color: red; border: 1px solid red; padding: 1rem; margin-bottom: 1rem;">
            <strong>Please correct the errors below:</strong>
            {{ form.errors }}
        </div>
    {% endif %}

    <nav>
            <a href="{% url 'blog:home' %}">Home</a>
               
        {% if user.is_authenticated %}
            <a href="{% url 'blog:post_create' %}">Create Post</a>
            <span>Welcome {{ user.username }}</span>
            <a href="{% url 'blog:logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'blog:register' %}">Register</a>
            <a href="{% url 'blog:login' %}">Login</a>
        {% endif %}
    </nav>
    <hr>

    {% block content %}
    {% endblock %}

    <hr>

    <footer>
        <p>Footer over</p>
    </footer>
</body>
</html>
